# Workflow to Build and Deploy a Python app to Azure Web App
# Docs: https://github.com/Azure/webapps-deploy and https://aka.ms/python-webapps-actions
name: Build and deploy Python app to Azure Web App - sttm-data-titans-web-app

on:
  push:
    branches:
      - feature-branch # Trigger deployment on feature-branch pushes
  workflow_dispatch: # Allow manual trigger of this workflow

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required for actions/checkout

    steps:
      # Step 1: Checkout the repository code
      - name: Checkout source code
        uses: actions/checkout@v4

      # Step 2: Set up Python environment
      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # Correct Python version for your app

      # Step 3: Install dependencies in a virtual environment
      - name: Install dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Run Tests (Optional)
      # Uncomment and configure test cases for your app if needed
      # - name: Run Tests
      #   run: |
      #     source venv/bin/activate
      #     pytest  # Replace with any testing suite you want to run

      # Step 5: Upload application files (excluding venv) as artifacts
      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            . # Current directory with app files
            !venv/ # Exclude virtual environment directory

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write # Required for Azure login GitHub Action
      contents: read # Required for actions/checkout

    steps:
      # Step 1: Download artifact built in the `build` job
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      # Step 2: Login to Azure using GitHub secrets
      - name: Login to Azure
        uses: azure/login@v2
        with:
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}

      # Step 3: Deploy to Azure Web App
      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'sttm-data-titans-web-app' # Replace with your Azure Web App name
          slot-name: 'production' # Deployment slot (default is production)
