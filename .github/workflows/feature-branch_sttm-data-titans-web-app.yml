# Workflow to Deploy a Python App to Azure Web App Without GitHub Secrets
name: Build and deploy Streamlit app to Azure Web App - sttm-data-titans-web-app

on:
  push:
    branches:
      - feature-branch # Trigger workflow on push to the feature branch
  workflow_dispatch: # Allow manual triggering of the workflow

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for Azure login
      contents: read # Required for actions/checkout

    steps:
      # Step 1: Checkout the source code
      - name: Checkout the code repository
        uses: actions/checkout@v4

      # Step 2: Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # Step 3: Install the required dependencies
      - name: Install dependencies from requirements.txt
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Login to Azure using inline Publish Profile
      - name: Login to Azure
        uses: azure/login@v2
        with:
          publish-profile: |
            <?xml version="1.0" encoding="utf-8"?>
            <publishData>
              <publishProfile
                profileName="sttm-data-titans-web-app - Azure Web App"
                publishMethod="MSDeploy"
                ...  <!-- Entire Publish Profile content -->
              />
            </publishData>

      # Step 5: Deploy the application to Azure Web App
      - name: Deploy the Streamlit app to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'sttm-data-titans-web-app' # Replace with your actual Azure App name
          slot-name: 'production' # Replace if you're using a specific deployment slot